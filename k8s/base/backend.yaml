apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: stockcharts/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secret, key: POSTGRES_PASSWORD }
            # Optional alert channels (only these keys — broker credentials stay with the data service).
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: app-secret, key: TELEGRAM_BOT_TOKEN, optional: true }
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef: { name: app-secret, key: TELEGRAM_CHAT_ID, optional: true }
            - name: ALERTS_WEBHOOK_URL
              valueFrom:
                secretKeyRef: { name: app-secret, key: ALERTS_WEBHOOK_URL, optional: true }
          envFrom:
            - configMapRef: { name: app-config }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
