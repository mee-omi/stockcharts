apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stockcharts

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - data-service.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

images:
  - name: stockcharts/data-service
    newTag: latest
  - name: stockcharts/backend
    newTag: latest
  - name: stockcharts/frontend
    newTag: latest
