apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
data:
  POSTGRES_DB: stockcharts
  POSTGRES_USER: stockcharts
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # mock = synthetic data (no credentials). Overlays may switch to "zerodha", "angelone", etc.
  MARKET_DATA_PROVIDER: "mock"
  # mock = paper trading (virtual cash). Overlays may switch to "zerodha" or "angelone".
  TRADING_BROKER: "mock"
  DATA_SERVICE_URL: "http://data-service:8000"
  POSTGRES_HOST: "timescaledb"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "stockcharts"
  POSTGRES_USER: "stockcharts"
  # The backend sits behind the ingress, so the client IP for rate limiting is in X-Forwarded-For.
  RATE_LIMIT_TRUST_XFF: "true"
  # Running more than one backend replica? Set CLUSTER_ENABLED=true (ShedLock for scheduled jobs),
  # enable STOMP_RELAY_ENABLED with a RabbitMQ/ActiveMQ STOMP broker, and LIVE_ENABLED=true on
  # exactly one replica. The data service holds provider state in memory: keep it at 1 replica.
  CLUSTER_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "stockcharts"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "stockcharts"
  # ---- Zerodha market data (PyZData / enctoken) ----
  # Required when MARKET_DATA_PROVIDER=zerodha or kiteticker.
  ENCTOKEN: ""
  # ---- Zerodha trading (Kite Connect, paid subscription) ----
  # Required when TRADING_BROKER=zerodha.
  ZERODHA_API_KEY: ""
  ZERODHA_ACCESS_TOKEN: ""
  # ---- Angel One SmartAPI ----
  # Required when TRADING_BROKER=angelone or MARKET_DATA_PROVIDER=angelone.
  ANGELONE_API_KEY: ""
  ANGELONE_CLIENT_ID: ""
  ANGELONE_TOTP_SECRET: ""
  # ---- Alert delivery (optional) ----
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  ALERTS_WEBHOOK_URL: ""
