# Copy to broker.secret.yaml and fill in credentials for your chosen trading broker.
# broker.secret.yaml is gitignored — NEVER commit real credentials.
#
# --- Option A: Zerodha Kite Connect (paid subscription) ---
# Generate api_key at kite.trade. Refresh access_token daily via OAuth.
#
# --- Option B: Angel One SmartAPI ---
# Get api_key from myaccount.angelone.in > Apps. Use your login ID as client_id.
# Generate TOTP secret at myaccount.angelone.in > My Profile > Enable TOTP. Login also needs your MPIN.
# These same credentials power the market-data providers (MARKET_DATA_PROVIDER=kiteticker / angelone).
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
stringData:
  # Zerodha trading (TRADING_BROKER=zerodha)
  ZERODHA_API_KEY: "PASTE_YOUR_KITE_API_KEY_HERE"
  ZERODHA_ACCESS_TOKEN: "PASTE_YOUR_DAILY_ACCESS_TOKEN_HERE"

  # Angel One trading (TRADING_BROKER=angelone)
  # ANGELONE_API_KEY: "PASTE_YOUR_SMARTAPI_KEY_HERE"
  # ANGELONE_CLIENT_ID: "PASTE_YOUR_CLIENT_ID_HERE"
  # ANGELONE_PIN: "PASTE_YOUR_ACCOUNT_MPIN_HERE"
  # ANGELONE_TOTP_SECRET: "PASTE_YOUR_TOTP_SECRET_HERE"
