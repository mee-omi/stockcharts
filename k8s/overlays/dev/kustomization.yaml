apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev: synthetic mock data, no credentials required.
resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: app-config
    patch: |
      - op: replace
        path: /data/MARKET_DATA_PROVIDER
        value: "mock"
