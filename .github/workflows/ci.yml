name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    services:
      # Real TimescaleDB so the Flyway migrations and entity mappings are verified end to end.
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: stockcharts
          POSTGRES_USER: stockcharts
          POSTGRES_PASSWORD: stockcharts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockcharts"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STOCKCHARTS_TEST_PG_URL: jdbc:postgresql://localhost:5432/stockcharts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test (unit, H2 integration, Postgres migrations)
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports

  data-service:
    name: Data service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (mocked API)
        run: npx playwright test
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize base and dev overlay
        run: |
          kubectl kustomize k8s/base > /dev/null
          kubectl kustomize k8s/overlays/dev > /dev/null

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, data-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build data-service
        uses: docker/build-push-action@v6
        with:
          context: data-service
          push: false
          cache-from: type=gha,scope=data-service
          cache-to: type=gha,mode=max,scope=data-service
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
