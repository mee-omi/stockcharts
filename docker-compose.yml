services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockcharts}
      POSTGRES_USER: ${POSTGRES_USER:-stockcharts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockcharts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # host 5433 avoids conflict with any existing postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockcharts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  data-service:
    build: ./data-service
    environment:
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      ENCTOKEN: ${ENCTOKEN:-}
      TRADING_BROKER: ${TRADING_BROKER:-mock}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:-}
      ZERODHA_ACCESS_TOKEN: ${ZERODHA_ACCESS_TOKEN:-}
      ANGELONE_API_KEY: ${ANGELONE_API_KEY:-}
      ANGELONE_CLIENT_ID: ${ANGELONE_CLIENT_ID:-}
      ANGELONE_PIN: ${ANGELONE_PIN:-}
      ANGELONE_TOTP_SECRET: ${ANGELONE_TOTP_SECRET:-}
      # Real brokers stream only during the NSE session; list exchange holidays (YYYY-MM-DD,...).
      LIVE_MARKET_HOURS_ONLY: ${LIVE_MARKET_HOURS_ONLY:-true}
      MOCK_ALWAYS_OPEN: ${MOCK_ALWAYS_OPEN:-false}
      NSE_HOLIDAYS: ${NSE_HOLIDAYS:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-stockcharts}
      POSTGRES_USER: ${POSTGRES_USER:-stockcharts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockcharts}
      DATA_SERVICE_URL: http://data-service:8000
      # Behind the frontend's nginx, the client IP for rate limiting is in X-Forwarded-For.
      RATE_LIMIT_TRUST_XFF: "true"
      # Login: the first visit creates the account. Set AUTH_SECRET (32+ chars) to keep sessions
      # valid across database resets; set AUTH_COOKIE_SECURE=true when served over HTTPS.
      # Exchange holidays: the backend's session calendar skips them (same list as the data service).
      NSE_HOLIDAYS: ${NSE_HOLIDAYS:-}
      PAPER_STARTING_CASH: ${PAPER_STARTING_CASH:-1000000}
      PAPER_SLIPPAGE_PCT: ${PAPER_SLIPPAGE_PCT:-0.05}
      PAPER_MIS_LEVERAGE: ${PAPER_MIS_LEVERAGE:-5}
      PAPER_SQUARE_OFF_TIME: ${PAPER_SQUARE_OFF_TIME:-15:20}
      PAPER_MARKET_HOURS_ONLY: ${PAPER_MARKET_HOURS_ONLY:-true}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Optional alert delivery channels.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERTS_WEBHOOK_URL: ${ALERTS_WEBHOOK_URL:-}
      # SPRING_PROFILES_ACTIVE=json for JSON (structured) logs.
      SPRING_PROFILES_ACTIVE: ${BACKEND_PROFILES:-}
      # Daily broker history download (after the close) into the candle store.
      HISTORY_SYNC_ENABLED: ${HISTORY_SYNC_ENABLED:-true}
      HISTORY_SYNC_TIMEFRAMES: ${HISTORY_SYNC_TIMEFRAMES:-1d:1825,15m:120,1m:30}
      HISTORY_SYNC_INDICES: ${HISTORY_SYNC_INDICES:-NIFTY50}
    depends_on:
      timescaledb:
        condition: service_healthy
      data-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
